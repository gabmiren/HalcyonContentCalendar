<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../kit.css">
<title>Highlight covers (kit v2)</title>
<style>
.cov{width:1080px;height:1920px;position:relative;overflow:hidden;background:radial-gradient(700px 700px at 50% 50%,rgba(0,251,244,.10),transparent 70%),var(--ground)}
.ic{position:absolute;left:540px;top:960px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;width:640px;height:640px;border-radius:50%;border:4px solid var(--cyan-line)}
.big{font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.sheet .row{position:absolute;left:80px;right:80px;top:560px;display:flex;justify-content:space-between}
.sheet .it{width:136px;text-align:center}
.sheet .ci{width:136px;height:136px;border-radius:50%;border:3px solid var(--cyan-line);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(0,251,244,.10),transparent 70%),var(--ground)}
.sheet .t{font-size:26px;margin-top:16px;color:var(--grey)}
</style></head><body>

<section class="slide cov" data-name="hl_start"><div class="ic"><img src="../brand/logo_mark.png" style="width:400px"></div></section>
<section class="slide cov" data-name="hl_rules"><div class="ic" style="flex-direction:column"><div class="big" style="font-size:200px">4:45</div><div class="label" style="font-size:44px;margin-top:10px">PM ET</div></div></section>
<section class="slide cov" data-name="hl_dynamic"><div class="ic"><div class="big c" style="font-size:190px">$50K</div></div></section>
<section class="slide cov" data-name="hl_explainers"><div class="ic" style="flex-direction:column"><div class="big" style="font-size:210px">1 pt</div><div class="label" style="font-size:40px;margin-top:14px">= $50 on ES</div></div></section>
<section class="slide cov" data-name="hl_news"><div class="ic">
  <svg width="420" height="300" viewBox="0 0 420 300" fill="none">
    <g stroke-width="5">
    <line x1="40" y1="170" x2="40" y2="250" stroke="#AFAFAF"/><rect x="24" y="190" width="32" height="44" rx="4" fill="rgba(175,175,175,.74)" stroke="#AFAFAF"/>
    <line x1="110" y1="140" x2="110" y2="230" stroke="#00FBF4"/><rect x="94" y="160" width="32" height="50" rx="4" fill="rgba(0,251,244,.08)" stroke="#00FBF4"/>
    <line x1="180" y1="150" x2="180" y2="220" stroke="#AFAFAF"/><rect x="164" y="165" width="32" height="38" rx="4" fill="rgba(175,175,175,.74)" stroke="#AFAFAF"/>
    <line x1="250" y1="80" x2="250" y2="190" stroke="#00FBF4"/><rect x="234" y="100" width="32" height="70" rx="4" fill="rgba(0,251,244,.08)" stroke="#00FBF4"/>
    <line x1="320" y1="40" x2="320" y2="140" stroke="#00FBF4"/><rect x="304" y="55" width="32" height="65" rx="4" fill="rgba(0,251,244,.08)" stroke="#00FBF4"/>
    <line x1="390" y1="50" x2="390" y2="120" stroke="#AFAFAF"/><rect x="374" y="62" width="32" height="40" rx="4" fill="rgba(175,175,175,.74)" stroke="#AFAFAF"/>
    </g></svg></div></section>
<section class="slide cov" data-name="hl_memes"><div class="ic"><div class="big" style="font-size:230px">lol</div></div></section>

<section class="slide sheet" data-name="hlSheet" data-pg="end">
  <div class="kick">Profile setup</div>
  <div class="h-slide">Highlight <span class="c">covers</span></div>
  <div class="row">
    <div class="it"><div class="ci"><img src="../brand/logo_mark.png" style="width:84px"></div><div class="t">Start</div></div>
    <div class="it"><div class="ci big" style="font-size:40px">4:45</div><div class="t">Rules</div></div>
    <div class="it"><div class="ci big c" style="font-size:38px">$50K</div><div class="t">Dynamic</div></div>
    <div class="it"><div class="ci big" style="font-size:42px">1 pt</div><div class="t">Explainers</div></div>
    <div class="it"><div class="ci"><svg width="84" height="60" viewBox="0 0 420 300" fill="none" stroke-width="18"><path d="M40 230 L110 180 L180 200 L250 120 L320 70 L390 90" stroke="#00FBF4" stroke-linejoin="round" stroke-linecap="round"/></svg></div><div class="t">News</div></div>
    <div class="it"><div class="ci big" style="font-size:46px">lol</div><div class="t">Memes</div></div>
  </div>
  <div class="body" style="position:absolute;left:80px;right:80px;top:820px">Six 1080 x 1920 files, centred for Instagram's circle crop. Cyan and ink on ground only.</div>
</section>
</body></html>
