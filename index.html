acter. FVG is a fair value gap, and an IFVG is a gap price broke through that now works the other way.\n\nEvery chart reads like alphabet soup at first. Save this for the next time someone in chat says the IFVG held.\n\nWhich term took you the longest to figure out?\n\n👉 Ask us the rest in our Discord: link in bio","videos":[{"src":"media/trading-terms-part-1.mp4","label":"Trading terms · SL to IFVG"}]},{"id":"T33","platform":"TikTok","date":"2026-11-21","time":"07:00","timeLabel":"7:00 AM ET","myt":"8:00 PM Sat 21 Nov MYT","day":"Post","title":"Myth or fact: evaluation edition","pillar":"Entertainment","format":"Photo carousel · 12 slides · same set as the Instagram quiz","src":"IG drafts","status":"Scheduled","scls":"ok","ctx":"Saturday","why":"The same play-along quiz as the Instagram carousel, posted at the same time so Saturday has a TikTok. Photo posts with a question get comments, which TikTok hasn't had much of yet.","todo":["Moved 20 Nov to 8:00 PM Sat 21 MYT (7:00 AM ET) in Metricool to free Friday 8 PM for the Anthropic IPO reel, auto-publish, with TikTok's auto-added music"],"dep":null,"fb":null,"fbcap":null,"fbimg":null,"caption":"Myth or fact quiz on the $50K prop firm evaluation: five futures trading rules, from the 1 trading day minimum to micros vs minis. Call each one before you swipe and comment your score out of 5","videos":[],"slides":["mfA_1","mfA_2","mfA_3","mfA_4","mfA_5","mfA_6","mfA_7","mfA_8","mfA_9","mfA_10","mfA_11","mfA_12"],"reel":null,"story":null,"extra":[],"pub":"scheduled"},{"dep":null,"fb":null,"fbcap":null,"fbimg":null,"videos":[{"src":"media/ant-ipo-explainer.mp4","label":""}],"slides":[],"reel":null,"story":null,"extra":null,"src":"Built 20 Nov","scls":"ok","title":"Anthropic soared. The Nasdaq sank.","pillar":"News","status":"Scheduled","ctx":"Friday · day after the ANT IPO","why":"Built 20 Nov in the new 90s finance look: Higgsfield archival footage (trading pit, restaurant queue, CRT desk) with VHS texture, LED closing board  often comes back to fill\n- MT is the mean threshold, the halfway point of an order block\n- SMT is smart money technique, when related markets like ES and NQ stop moving together\n- LS is a liquidity sweep, a quick run through highs or lows before price turns\n\nBSL and SSL are buyside and sellside liquidity, the stops resting above highs and below lows. EQH and EQL are equal highs and equal lows, and PDH and PDL are the previous day's high and low.\n\nThese are the levels traders argue about in chat every morning.\n\nWhich one do you mark on your chart first?\n\n👉 Ask us the rest in our Discord: link in bio","videos":[{"src":"media/liquidity-terms-sound.mp4","label":"Liquidity terms · VI to PDL · with sound"}]},{"id":"T36","platform":"TikTok","date":"2026-11-23","time":"16:00","timeLabel":"4:00 PM ET","myt":"5:00 AM Tue 24 Nov MYT","day":"Founder clip","title":"What if you could pick your account after you pass?","pillar":"Education","format":"Reel · founder clip with motion cutaways · 26 s","src":"Founder clip · cut from Steve's \"How Halcyon accounts work\" video","status":"Ready","scls":"ok","ctx":"Monday · second slot","why":"Pick after you pass is Halcyon's clearest difference, told by Steve with motion cutaways. Ready now. 4:00 PM ET is the second peak on both heat maps (5:00 AM MYT next day).","todo":["Same file as the Instagram Reel","Disclaimer is on the end card"],"dep":null,"fb":null,"fbcap":null,"fbimg":null,"caption":"What if you could pick your prop firm account after you pass: Founder Steve on the $50K Halcyon Dynamic evaluation and choosing a 50K, 75K, 100K or 150K reward account","videos":[{"src":"media/accounts-2-pick-after-you-pass-recut.mp4","label":""}],"slides":[],"reel":null,"story":null,"extra":[],"pub":"none"},{"id":"T37","platform":"TikTok","date":"2026-11-27","time":"16:00","timeLabel":"4:00 PM ET","myt":"5:00 AM Sat 28 Nov MYT","day":"Founder clip","title":"Lite, Prime or Dynamic: which one fits you?","pillar":"Education","format":"Ree const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function dt(iso){const [y,m,dd]=iso.split("-").map(Number);return new Date(Date.UTC(y,m-1,dd));}
function fmt(iso){const x=dt(iso);return DOW[(x.getUTCDay()+6)%7]+" "+x.getUTCDate()+" Nov";}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1400);}
function copy(t,msg){const done=()=>toast(msg||"Copied");
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fb(t,done))}else fb(t,done);}
function fb(t,done){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("Copy blocked here: select the text instead")}a.remove();}

let plat="TikTok"; const off=new Set();
try{const s=localStorage.getItem("hal_cal2_plat");if(s==="TikTok"||s==="Instagram")plat=s;}catch(e){}
if(location.hash==="#ig")plat="Instagram"; if(location.hash==="#tiktok")plat="TikTok";
const vis=p=>p.platform===plat&&!off.has(p.pillar);
const P=D.posts;

 const used=new Set(P.filter(p=>p.platform===plat).map(p=>p.pillar));

}

// grid: one block per month (Nov and Dec 2026)
const MONTHS=[[2026,10,"November"],[2026,11,"December"]];
const LAUNCH="2026-11-06";
function grid(){
 let h="";
 const iso=d=>d.toISOString().slice(0,10), DAY=864e5, wk0=Date.UTC(2026,10,2); // Mon 2 Nov = week 45
 const cardHTML=p=>`<div class="card" style="--pc:${D.pil[p.pillar].c}" data-id="${p.id}">${pubDot(p)}
     <div class="m"><span class="lab" style="color:var(--ink2);letter-spacing:.04em">${esc(p.timeLabel.replace(" ET",""))}</span><span class="tag ${p.platform==="TikTok"?"tt":"ig"}">${p.platform==="TikTok"?"TikTok":"IG"}</span><span class="st ${p.scls}">${esc(p.status)}</span></div>
     <div class="t">${esc(p.title)}</div><div class="sub2">${esc(p.format)}</div></div>`;
 for(const [y,m,name] of MONTHS){
  const first=Date.UTC(y,m,1), last=Date.UTC(y,m+1,0);
  const mIso=iso(new Date(first)).slice(0,7);
  const mc=P.filter(p=>vis(p)&&p.date.startsWith(mIso)).length;
  h+=`<div class="mh"><h3>${name} <em>${y}</em></h3><span class="lab">${mc} post${mc===1?"":"s"}</span></div>`;
  h+=DOW.map(x=>`<div class="dh lab">${x}</div>`).join("");
  let mon=first-((new Date(first).getUTCDay()+6)%7)*DAY;
  for(;mon<=last;mon+=7*DAY){
   const sun=mon+6*DAY, a=iso(new Date(mon)), z=iso(new Date(sun));
   const wn=45+Math.round((mon-wk0)/(7*DAY));
   const fmtD=t=>new Date(t).getUTCDate()+" "+new Date(t).toLocaleString("en-GB",{month:"short",timeZone:"UTC"});
   const wc=P.filter(p=>vis(p)&&p.date>=a&&p.date<=z&&p.date.startsWith(mIso)).length;
   h+=`<div class="wk"><span class="lab" style="color:var(--ink2)">Week ${wn} · ${fmtD(mon)} to ${fmtD(sun)}</span><span class="lab">${wc?wc+" post"+(wc===1?"":"s"):""}</span></div>`;
   for(let i=0;i<7;i++){
    const t=mon+i*DAY, d=iso(new Date(t)), inM=d.startsWith(mIso);
    if(!inM){h+=`<div class="day out pad"><div class="dn"><b>${new Date(t).getUTCDate()}</b></div></div>`;continue;}
    const pre=d<LAUNCH;
    const ps=P.filter(p=>p.date===d&&vis(p)).sort((a,b)=>a.time.localeCompare(b.time));
    const ev=(D.events[d]||[]).map(e=>`<div class="ev">${esc(e)}</div>`).join("");
    const ig=P.find(p=>p.date===d&&p.platform==="Instagram"&&p.story);
    const lane=(ig&&plat==="Instagram")?`<div class="lane"><b>IG STORY</b> ${esc(ig.story[0])}</div>`:"";
    h+=`<div class="day ${pre?"out":""}"><div class="dn"><b>${new Date(t).getUTCDate()}</b><span class="lab">${pre?"before launch":""}</span></div>${pre?"":ev}${ps.map(cardHTML).join("")}${lane}</div>`;
   }
  }
 }
 $("#grid").innerHTML=h;
 document.querySelectorAll(".card").forEach(c=>c.onclick=()=>open(c.dataset.id));
}

function mediaHTML(p){
 if(p.videos.length) return `<div class="vids">${p.videos.map(v=>v.drive?`<figure class="drv"><a class="dlb pri" href="${esc(v.src)}" target="_blank" rel="noopener">Watch in Google Drive</a>${v.label?`<figcaption>${esc(v.label.replace("Watch in Drive · ",""))}</figcaption>`:""}</figure>`:`<figure><video src="${v.src}" controls playsinline preload="metadata"></video>${v.label?`<figcaption>${esc(v.label)}</figcaption>`:""}</figure>`).join("")}</div>`;
 if(p.slides.length) return `<div class="thumbs">${p.slides.map(s=>`<img src="media/ig/${s}.jpg" alt="${s}" loading="lazy">`).join("")}</div>`;
 if(pubState(p)[0]==="g") return `<div class="ph">Posted<br>No file attached here</div>`;
 return `<div class="ph">To build<br>${esc(p.status.replace("To build · ",""))}</div>`;
}
function extrasHTML(p,F){
 const g=[]; (p.extra||[]).forEach(x=>{if(x[0]||!g.length)g.push({t:x[0],imgs:[x[1]]});else g[g.length-1].imgs.push(x[1]);});
 return g.map(x=>F("Also",`${esc(x.t)}<div style="display:flex;gap:10px;margin-top:10px">${x.imgs.map(s=>`<img src="media/ig/${s}.jpg" style="width:${x.imgs.length>2?"31%":x.imgs.length>1?"48%":"100%"};max-width:420px;border:1px solid var(--line);border-radius:10px;display:block">`).join("")}</div><div class="dlr">${x.imgs.map((s,i)=>dlb(x.imgs.length>1?"Download "+(i+1):"Download image","media/ig/"+s+".jpg",slug(x.t||p.title)+(x.imgs.length>1?"-"+(i+1):"")+".jpg")).join("")}</div>`)).join("");
}
// downloads: every video and graphic can be saved from the post panel
const slug=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const dlb=(label,url,name,cls)=>`<button class="dlb${cls?" "+cls:""}" data-url="${esc(url)}" data-name="${esc(name)}">${esc(label)}</button>`;
function dlHTML(p){
 const b=slug(p.title);
 if(p.videos.length) return `<div class="dlr">${p.videos.map((v,i)=>v.drive?`<a class="dlb" href="${esc(v.src)}" target="_blank" rel="noopener">Download from Drive</a>`:dlb("Download video",v.src,b+(p.videos.length>1?"-"+(i+1):"")+".mp4","pri")).join("")}</div>`;
 if(p.slides.length===1) return `<div class="dlr">${dlb("Download image","media/ig/"+p.slides[0]+".jpg",b+".jpg","pri")}</div>`;
 if(p.slides.length) return `<div class="dlr"><button class="dlb pri" data-zip="${esc(p.id)}">Download all ${p.slides.length} slides (ZIP)</button>${p.slides.map((s,i)=>dlb("Slide "+(i+1),"media/ig/"+s+".jpg",b+"-"+(i+1)+".jpg")).join("")}</div>`;
 return "";
}
function saveBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
let DLNS;
async function saveFile(blob,name){
 if(window.claude&&claude.use){ if(DLNS===undefined) DLNS=await claude.use("downloads"); if(DLNS){await DLNS.save({filename:name,data:blob});return;} }
 saveBlob(blob,name);
}
async function getBytes(url){const r=await fetch(url);if(!r.ok)throw new Error(url);return new Uint8Array(await r.arrayBuffer());}
const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function zipStore(files){
 const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 const hdr=(n,fill)=>{const u=new Uint8Array(n);fill(new DataView(u.buffer));return u;};
 for(const f of files){
  const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
  const loc=hdr(30,d=>{d.setUint32(0,0x04034b50,true);d.setUint16(4,20,true);d.setUint16(6,0x0800,true);d.setUint16(12,33,true);d.setUint32(14,crc,true);d.setUint32(18,sz,true);d.setUint32(22,sz,true);d.setUint16(26,nm.length,true);});
  parts.push(loc,nm,f.data);
  const c=hdr(46,d=>{d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);d.setUint16(14,33,true);d.setUint32(16,crc,true);d.setUint32(20,sz,true);d.setUint32(24,sz,true);d.setUint16(28,nm.length,true);d.setUint32(42,off,true);});
  cen.push(c,nm);off+=30+nm.length+sz;
 }
 const cs=cen.reduce((a,x)=>a+x.length,0);
 const end=hdr(22,d=>{d.setUint32(0,0x06054b50,true);d.setUint16(8,files.length,true);d.setUint16(10,files.length,true);d.setUint32(12,cs,true);d.setUint32(16,off,true);});
 return new Blob([...parts,...cen,end],{type:"application/zip"});
}
document.addEventListener("click",async e=>{
 const btn=e.target.closest&&e.target.closest(".dlb"); if(!btn) return;
 const t0=btn.textContent; btn.disabled=true; btn.textContent="Preparing…";
 try{
  if(btn.dataset.zip){
   const p=P.find(x=>x.id===btn.dataset.zip),b=slug(p.title);
   const files=await Promise.all(p.slides.map(async(s,i)=>({name:b+"-"+(i+1)+".jpg",data:await getBytes("media/ig/"+s+".jpg")})));
   await saveFile(zipStore(files),b+"-slides.zip");
  }else{
   const d=await getBytes(btn.dataset.url);
   await saveFile(new Blob([d]),btn.dataset.name);
  }
  toast("Download started");
 }catch(err){ if(err&&err.code==="declined"){} else if(err&&err.code){toast("Couldn't save here, try the GitHub page");} else if(btn.dataset.url){const a=document.createElement("a");a.href=btn.dataset.url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();} else toast("Download failed, try the single slides"); }
 btn.disabled=false; btn.textContent=t0;
});
// publish state: red = not scheduled, green = scheduled in Metricool or posted (no yellow, 20 Nov)
function pubState(p){
 if(p.pub==="posted") return ["g","Posted"];
 if(p.pub==="none") return ["r","Not scheduled"];
 if(p.pub==="scheduled") return ["g","Scheduled"];
 if(D.scheduledThrough&&p.date<=D.scheduledThrough) return ["g","Scheduled"];
 return ["r","Not scheduled"];
}
const pubDot=p=>{const [c,t]=pubState(p);return `<span class="pub ${c}" title="${t}"></span>`;};
function scriptHTML(p){
 const c=p.script; if(!c) return "";
 const rows=c.beats.map(b=>`<tr><td style="white-space:nowrap;color:var(--ink2)">${esc(b[0])}</td><td>${esc(b[1])}</td><td style="color:var(--ink2)">${esc(b[2])}</td></tr>`).join("");
 const vo=c.beats.map(b=>b[2]).filter(t=>t&&t[0]!=="(").join(" ");
 return `<div class="lab" style="margin-top:18px">Script and storyboard</div>
 <div class="f" style="margin:8px 0 10px"><div>Hook</div><div><b>${esc(c.hook)}</b></div><div>Length</div><div>${esc(c.len)}</div><div>One device</div><div>${esc(c.device)}</div></div>
 <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;line-height:1.5"><thead><tr style="text-align:left" class="lab"><th style="padding:6px 8px 6px 0">Time</th><th style="padding:6px 8px">On screen</th><th style="padding:6px 0 6px 8px">Voice</th></tr></thead><tbody class="sb">${rows}</tbody></table></div>
 ${vo?`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px" class="lab">Voiceover <button class="btn" id="cv">Copy voiceover</button></div><pre>${esc(vo)}</pre>`:""}
 <ul style="margin:8px 0 18px 18px;font-size:13px;line-height:1.55;color:var(--ink2)">${c.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`;
}
// drawer
function open(id){
 const p=P.find(x=>x.id===id), pl=D.pil[p.pillar];
 const F=(k,v)=>v?`<div>${k}</div><div>${v}</div>`:"";
 const todo=p.todo&&p.todo.length?`<ul>${p.todo.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:"";
 const fbx=p.fb?`<div class="fbx"><div class="lab">Backup</div><p style="margin:6px 0"><b>${esc(p.fb[0])}.</b> <span style="color:var(--ink2)">${esc(p.fb[1])}</span></p>${p.fbimg?`<div class="thumbs" style="grid-template-columns:repeat(4,1fr)">${p.fbimg.map(s=>`<img src="media/ig/${s}.jpg">`).join("")}</div>`:""}${p.fbcap?`<div style="display:flex;justify-content:space-between;align-items:center" class="lab">Backup caption <button class="btn" id="cb">Copy backup caption</button></div><pre>${esc(p.fbcap)}</pre>`:""}</div>`:"";
 $("#dr").innerHTML=`<button class="x" onclick="closeD()">Close</button>
 <div class="lab">${p.platform} · ${p.day} · ${fmt(p.date)} · ${esc(p.timeLabel)} (${esc(p.myt)})</div>
 <h2>${esc(p.title)}</h2>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px"><span class="tag" style="color:${pl.c};border-color:${pl.c}">${p.pillar}</span><span class="tag ${p.platform==="TikTok"?"tt":"ig"}">${p.platform}</span><span class="tag">${esc(p.format)}</span><span class="tag">${esc(p.src)}</span><span class="st ${p.scls}">${esc(p.status)}</span><span class="pubk" style="margin-left:4px"><i style="background:${({r:"#ff5a6e",y:"#ffc94a",g:"#3ddc84"})[pubState(p)[0]]}"></i>${pubState(p)[1]}</span></div>
 ${p.dep?`<div class="box"><b>Waiting on Halcyon:</b> ${esc(p.dep)}</div>`:""}
 ${mediaHTML(p)}
 ${dlHTML(p)}
 <div class="f">${F("Context",esc(p.ctx))}${F("Why here",esc(p.why))}${F("To do",todo)}${p.reel?F("IG Reel",esc(p.reel[0])+" ("+esc(p.reel[1])+"), 6:00 PM ET"):""}${p.story?F("IG Story",`<b>${esc(p.story[0])}</b><br><span style="color:var(--ink2)">${esc(p.story[2])}</span><div style="width:170px;margin-top:10px"><img src="media/ig/${p.story[1]}.jpg" style="width:100%;border:1px solid var(--line);border-radius:10px;display:block"></div><div class="dlr">${dlb("Download Story image","media/ig/"+p.story[1].replace(/^(st[A-F])p$/,"$1")+".jpg",slug(p.story[0])+"-story.jpg","pri")}</div>`):""}${extrasHTML(p,F)}</div>
 ${fbx}
 ${scriptHTML(p)}
 <div style="display:flex;justify-content:space-between;align-items:center" class="lab">Caption <button class="btn" id="cc">Copy caption</button></div>
 <pre>${esc(p.caption)}</pre>`;
 $("#cc").onclick=()=>copy(p.caption,"Caption copied");
 if($("#cv"))$("#cv").onclick=()=>copy(p.script.beats.map(b=>b[2]).filter(t=>t&&t[0]!=="(").join(" "),"Voiceover copied");
 if($("#cb"))$("#cb").onclick=()=>copy(p.fbcap,"Backup caption copied");
 $("#dr").classList.add("on");$("#ov").classList.add("on");$("#dr").scrollTop=0;
}
function closeD(){$("#dr").classList.remove("on");$("#ov").classList.remove("on");}
// lightbox: click any image in the drawer to view it full size, arrows step through that post's images
let LB=[],LI=0;
function lbShow(){const im=LB[LI];$("#lbi").src=im.src;$("#lbc").textContent=LB.length>1?`${LI+1} / ${LB.length} · use ← → to browse, Esc to close`:"Esc to close";$("#lbp").style.display=$("#lbn").style.display=LB.length>1?"":"none";}
function lbOpen(img){LB=[...$("#dr").querySelectorAll("img")];LI=Math.max(0,LB.indexOf(img));lbShow();$("#lb").classList.add("on");}
function lbClose(){$("#lb").classList.remove("on");}
function lbStep(d){if(!LB.length)return;LI=(LI+d+LB.length)%LB.length;lbShow();}
$("#dr").addEventListener("click",e=>{if(e.target.tagName==="IMG"){e.preventDefault();lbOpen(e.target);}});
$("#lbx").onclick=lbClose;$("#lbp").onclick=e=>{e.stopPropagation();lbStep(-1)};$("#lbn").onclick=e=>{e.stopPropagation();lbStep(1)};
$("#lb").onclick=e=>{if(e.target.id==="lb")lbClose();};
$("#ov").onclick=closeD;
document.addEventListener("keydown",e=>{const on=$("#lb").classList.contains("on");
 if(e.key==="Escape"){on?lbClose():closeD();}
 else if(on&&e.key==="ArrowRight")lbStep(1); else if(on&&e.key==="ArrowLeft")lbStep(-1);});

document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{plat=b.dataset.p;try{localStorage.setItem("hal_cal2_plat",plat)}catch(e){}render();});
function render(){document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.p===plat));legend();grid();}
render();
